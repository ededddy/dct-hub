# dct-hub dev config: points at the bundled sample project.
project_dir: ./sample_project
host: 127.0.0.1
port: 8080
dct_bin: dct
storage:
  dir: .hub
render:
  format: html
  timeout_s: 120
  # Shared dct query-result cache (L1). All renders serialize on it
  # (DuckDB single-writer), which dct-hub enforces by dropping the
  # render worker pool to a single worker when this is set.
  query_cache: .hub/query-cache.duckdb

# Freshness policy for rendered artifacts (M3):
# policy:
#   default_ttl_s: 3600      # serve cached artifacts younger than this
#   frozen_date_vars: true   # boards with all date vars < today never re-render
#   min_interval_s: 300      # min seconds between renders of one artifact
#   max_concurrent: 2        # render workers (forced to 1 with query_cache)
#   max_renders_per_minute: 30 # per-identity render cap (auto + force); 0 = unlimited

# retention:                 # artifact GC — opt-in (M5)
#   enabled: true            # frozen snapshots are NEVER pruned
#   max_age_days: 30         # prune non-frozen artifacts older than this
#   max_per_board: 100       # keep newest N non-frozen artifacts per board
#   sweep_interval_s: 3600

# warm:                      # deploy-pipeline cache warming (POST /api/warm):
#   boards:                  # one call after a deploy renders these so no
#     - sales_daily          # viewer pays a cold miss. Auto semantics —
#     - board: exec/overview # unchanged boards come back "cached" (no query).
#       vars:                # extra combos beyond the declared defaults
#         - {region: East}

# Access control — disabled for the local dev loop. To enable, set
# auth.enabled: true and fill in your Keycloak realm. Boards redirect
# unauthenticated browsers to SSO; API callers use Bearer service tokens.
#
# auth:
#   enabled: true
#   session_secret: ${DCT_HUB_SESSION_SECRET}   # any long random string
#   session_https_only: true                     # set false for http dev
#   oidc:
#     issuer: https://keycloak.corp.internal/realms/data
#     client_id: dct-hub
#     client_secret: ${KEYCLOAK_CLIENT_SECRET}
#     groups_claim: groups                       # realm role/group mapper
#   service_tokens:
#     - token: ${DCT_HUB_CI_TOKEN}
#       name: ci
#       groups: [data-ops]
#
# access:
#   roles:                                       # capability sets (defaults shown)
#     viewer:   [view]
#     operator: [view, refresh]
#     admin:    [view, refresh, manage]
#   grants:
#     # Most specific path wins; same-pattern grants union. No match = deny.
#     - path: "*"            role: viewer   groups: [data]
#     - path: "*"            role: operator groups: [data-ops]
#     - path: finance/*      role: operator groups: [finance]
#     - path: restricted/*   role: viewer   groups: [execs]
#     - path: exec/board     role: admin    users: [ceo@corp.com]
