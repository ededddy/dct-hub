[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dct-hub"
version = "0.1.0"
description = "On-demand rendering, snapshot cache, access control and catalog UI for dbt Charts (dct)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
dct-hub = "dct_hub.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dct_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
