<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}dct-hub{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f7; --card: #ffffff; --ink: #17191d; --muted: #5b6470;
      --line: #e2e5e9; --line-strong: #c6cdd5;
      --accent: #175cd3; --accent-btn: #175cd3; --accent-ink: #ffffff; --accent-soft: #eef4ff;
      --ok: #067647; --ok-soft: #ecfdf3; --warn: #b54708; --warn-soft: #fffaeb;
      --ice: #475467; --ice-soft: #eef1f4;
      --star: #f79009;
      /* radius scale: 6px small controls, 10px panels/cards, 999px pill controls */
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
           -webkit-font-smoothing: antialiased;
           /* never let anything stretch the page sideways (e.g. the off-canvas
              drawer mid-animation); clip avoids creating a scroll container */
           overflow-x: hidden; overflow-x: clip; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible, button:focus-visible, input:focus-visible,
    select:focus-visible, summary:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    header.top { display: flex; align-items: center; justify-content: space-between;
                 padding: 0 20px; height: 58px; background: var(--card);
                 border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
    .brand { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; color: var(--ink); }
    .brand:hover { text-decoration: none; }
    .side { display: flex; align-items: center; gap: 14px; font-size: 13px; }
    .who { color: var(--muted); }
    .ghost { border: 1px solid var(--line); background: transparent; color: var(--muted);
             border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 600;
             cursor: pointer; transition: color .15s ease, border-color .15s ease; }
    .ghost:hover { color: var(--ink); border-color: var(--line-strong); }
    .ghost:active { transform: translateY(1px); }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
    main.wide { max-width: 1240px; }
    @media (prefers-reduced-motion: no-preference) {
      main { animation: rise .35s cubic-bezier(.16, 1, .3, 1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
    }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px;
             font-size: 12px; font-weight: 600; white-space: nowrap; }
    .badge.frozen { background: var(--accent-soft); color: var(--accent); }
    .badge.fresh { background: var(--ok-soft); color: var(--ok); }
    .badge.stale { background: var(--warn-soft); color: var(--warn); }
    .badge.never { background: var(--ice-soft); color: var(--ice); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
            font-variant-numeric: tabular-nums; }
    button.primary { background: var(--accent-btn); color: var(--accent-ink); border: 0;
                     border-radius: 6px; padding: 7px 14px; font-weight: 600; cursor: pointer;
                     transition: filter .15s ease; }
    button.primary:hover:not(:disabled) { filter: brightness(1.08); }
    button.primary:active:not(:disabled) { transform: translateY(1px); }
    button.primary:disabled { opacity: .55; cursor: default; }
    @media (max-width: 768px) {
      /* touch targets: keep header controls comfortably tappable */
      .ghost { padding: 8px 16px; }
      .side a { display: inline-block; padding: 5px 2px; }
      button.primary { padding: 10px 16px; }
    }
  </style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">dct-hub</a>
  <div class="side">
    {% if user %}<span class="who">{{ user.name or user.sub }}</span><a href="/auth/logout">log out</a>
    {% elif auth_on %}<a href="/auth/login?next=/">log in</a>{% endif %}
  </div>
</header>
<main class="{% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>
</body>
</html>
